<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>勘地本</title>
<!-- 勘地本 PDF 模板：?p=1 自查题册｜2 实操十三步｜3 参数表·山地｜4 参数表·城市｜5 教材案例练习册
     导出：Chrome --headless=new --no-pdf-header-footer --print-to-pdf=... "http://localhost:8765/scripts/kandi-print.html?p=N" -->
<style>
@page{size:A4;margin:13mm 13mm 15mm}
:root{--ink:#1f2d38;--ink2:#4a5c69;--mute:#7f919e;--line:#bcd2e2;--line2:#dbe8f1;--dai:#2f6690;--sky:#7fb3d5;--soft:#dceaf5;--bg:#f7fbfe;--c1:#2f6690;--c2:#4f90c0;--c3:#9cc7e4;--seal:#a9442f;--qing:#4f8a74;--zhu:#a9442f;--jin:#9c7a45;--paper:#e9f2f8}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:10.5pt/1.65 "Songti SC","STSong",serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sans{font-family:"PingFang SC",sans-serif}
.cover{height:262mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:radial-gradient(circle at 82% 14%,rgba(255,255,255,.2),transparent 28%),radial-gradient(circle at 12% 88%,rgba(255,255,255,.12),transparent 30%),linear-gradient(160deg,var(--c1),var(--c2) 60%,var(--c3));color:#fff;border-radius:6px;page-break-after:always}
.cover .seal{background:var(--seal);color:#fff;width:58px;height:58px;display:grid;place-items:center;font:700 20px/1 serif;writing-mode:vertical-rl;border-radius:5px;margin-bottom:22px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cover h1{font-size:34pt;letter-spacing:.35em;margin:0 0 0 .35em;font-weight:600}
.cover h2{font-size:16pt;letter-spacing:.2em;font-weight:500;margin:14px 0 26px}
.cover p{color:rgba(255,255,255,.9);font-size:10pt;max-width:130mm;margin:4px 0;font-family:"PingFang SC",sans-serif}
.cover .no{margin-top:30px;font-size:9pt;letter-spacing:.3em;opacity:.8}
h2.t{font-size:15pt;letter-spacing:.15em;border-bottom:1.5px solid var(--dai);padding-bottom:4px;margin:0 0 8px;color:var(--dai);page-break-after:avoid}
h3.c{color:var(--dai);font-size:12pt;margin:12px 0 4px;letter-spacing:.08em;display:flex;align-items:center;gap:8px;page-break-after:avoid}
h3.c span{display:inline-grid;place-items:center;width:20px;height:20px;background:linear-gradient(135deg,var(--dai),var(--sky));color:#fff;border-radius:4px;font-size:10pt}
.note{font-size:9.5pt;color:var(--ink2);font-family:"PingFang SC",sans-serif;margin:0 0 8px}
.src{color:var(--jin);font-size:8pt;white-space:nowrap;margin-left:4px;font-family:"PingFang SC",sans-serif}
.pb{page-break-before:always}
/* 题册 */
.q{display:grid;grid-template-columns:24px 1fr 62px;gap:4px;padding:3px 0;border-bottom:.5px dashed var(--line);page-break-inside:avoid;font-size:10.3pt}
.q .n{color:var(--dai);font-size:8.5pt;padding-top:2px;font-family:"PingFang SC",sans-serif}
.box{font-size:8.5pt;color:var(--mute);font-family:"PingFang SC",sans-serif;text-align:right;padding-top:2px}
.ans{display:grid;grid-template-columns:24px 1fr;gap:4px;font-size:9pt;font-family:"PingFang SC",sans-serif;padding:2px 0;border-bottom:.5px dotted var(--line2);page-break-inside:avoid}
.ans .n{color:var(--dai)}
.poem{font-size:12pt;line-height:2.2;letter-spacing:.06em;margin:4px 0 10px;padding:6px 12px;background:var(--bg);border-left:3px solid var(--sky);page-break-inside:avoid}
.poem b{font-size:9pt;color:var(--mute);font-family:"PingFang SC",sans-serif;display:block;letter-spacing:0;line-height:1.4}
.blank{display:inline-block;width:1.3em;border-bottom:1px solid var(--ink2);margin:0 1px}
table{border-collapse:collapse;width:100%;font-size:9pt;font-family:"PingFang SC",sans-serif;page-break-inside:avoid}
th,td{border:.6px solid var(--line);padding:1px 4px;text-align:center}th{background:var(--paper);font-weight:600;color:var(--dai)}
td.l{text-align:left}
/* 步骤 */
.step{border:1px solid var(--line);border-left:4px solid var(--sky);border-radius:6px;background:var(--bg);padding:7px 10px 6px;margin:8px 0;page-break-inside:avoid}
.step h3{margin:0;font-size:12.5pt;display:flex;align-items:center;gap:8px;color:var(--dai)}
.step h3 i{font-style:normal;width:22px;height:22px;background:linear-gradient(135deg,var(--dai),var(--sky));border-radius:50%;display:inline-grid;place-items:center;font-size:10pt;color:#fff}
.step .one{color:var(--ink2);margin:1px 0 4px 30px;font-size:10pt}
.blk{display:grid;grid-template-columns:52px 1fr;gap:4px;font-size:9.5pt;font-family:"PingFang SC",sans-serif;margin:2px 0}
.blk .l{font-size:8.5pt;border-radius:3px;text-align:center;height:16px;line-height:16px;margin-top:2px}
.l.do{background:var(--soft);color:var(--dai)}.l.ru{background:#e2efe8;color:var(--qing)}.l.wa{background:#f4e3dc;color:var(--zhu)}.l.out{background:#f3ead8;color:var(--jin)}
.blk ul{margin:0;padding-left:14px}.blk li{margin:0}
.ck li{list-style:none;margin-left:-14px}.ck li:before{content:"☐ ";color:var(--dai)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 22px;margin:10px 0}
.flow .g{grid-column:1/-1;font-size:10pt;color:#fff;background:linear-gradient(90deg,var(--dai),var(--sky));border-radius:4px;padding:2px 10px;letter-spacing:.15em}
.flow div.b{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);position:relative;min-height:62px}
.flow div.b i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--dai);color:#fff;font-size:9pt;margin-right:5px}
.flow div.b b{font-size:11pt;color:var(--dai)}
.flow div.b p{margin:2px 0 0;font-size:8.6pt;color:var(--ink2);font-family:"PingFang SC",sans-serif;line-height:1.45}
.flow div.b:after{content:"→";position:absolute;right:-17px;top:20px;color:var(--sky);font-size:14pt}
.flow div.b.e:after{display:none}
/* 表单 */
.form h3{font-size:11pt;margin:7px 0 3px;background:var(--paper);padding:3px 8px;border-left:3px solid var(--dai);color:var(--dai);page-break-after:avoid}
.fl{display:flex;gap:10px;font-size:9.3pt;font-family:"PingFang SC",sans-serif;margin:3px 0;align-items:flex-end}
.fl .f{flex:1;display:flex;gap:4px;align-items:flex-end}.fl .f span{white-space:nowrap}.fl .f u{flex:1;border-bottom:.7px solid var(--ink2);height:16px}
.lines div{border-bottom:.7px solid var(--line);height:20px}
.opts{font-size:9pt;font-family:"PingFang SC",sans-serif;margin:2px 0;line-height:1.75}.opts b{font-weight:600;margin-right:4px;color:var(--dai)}
.opts span{margin-right:9px;white-space:nowrap}.opts span:before{content:"☐";margin-right:2px;color:var(--dai)}
.compass{display:flex;gap:14px;align-items:center;page-break-inside:avoid}
.compass .leg{font-size:9pt;font-family:"PingFang SC",sans-serif;color:var(--ink2);line-height:1.8}
.qk table{font-size:8.3pt}.qk h3.c{margin:7px 0 2px;font-size:11pt}.qk td,.qk th{padding:0 4px}
/* 练习册 */
.case{border:1px solid var(--line);border-radius:6px;padding:7px 11px;margin:9px 0;page-break-inside:avoid}
.case h4{margin:0 0 3px;font-size:12pt;color:var(--dai);display:flex;gap:8px;align-items:center}
.case h4 i{font-style:normal;font-size:8.5pt;background:var(--soft);color:var(--dai);border-radius:3px;padding:0 6px;font-family:"PingFang SC",sans-serif}
.case h4 em{font-style:normal;color:#fff;background:var(--dai);border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:9pt}
.case .sit{font-size:10pt;margin:2px 0 4px}
.case ol{margin:0;padding-left:18px;font-size:9.6pt;font-family:"PingFang SC",sans-serif}
.case ol li{margin:2px 0}
.case ol li:after{content:"";display:block;border-bottom:.7px solid var(--line);height:17px}
.key{font-size:9.4pt;font-family:"PingFang SC",sans-serif;padding:4px 0;border-bottom:.5px dashed var(--line);page-break-inside:avoid}
.key b{color:var(--dai);font-family:"Songti SC",serif;font-size:10.5pt}
</style></head><body><div id="out"></div>
<script src="../data/kandi.js"></script>
<script>
const part=new URLSearchParams(location.search).get('p')||'1';
// 五册五色：1 墨金｜2 青绿｜3 赭石｜4 黛紫｜5 胭脂
const THEME={'1':['#3a3f47','#c9a45c','#f3f0e8','#ece4d2','#fbf9f4','#d9cfba','#2a2e35','#474d57','#8a7a5a','#a9442f'],
 '2':['#2e6e5a','#7fbfa3','#e7f3ee','#d8ece3','#f6fbf9','#b7d8c9','#2e6e5a','#4f9a7f','#a3d4bf','#a9442f'],
 '3':['#8a5a2b','#d1a56f','#f6eee2','#efe1cc','#fcf8f2','#e0cdb0','#7a4f26','#a8753f','#dcbc8a','#a9442f'],
 '4':['#5b4a8a','#a99bd6','#efecf7','#e3def3','#f9f8fd','#d0c8e8','#4f4080','#7a68b0','#c0b4e3','#a9442f'],
 '5':['#a03c3c','#e09a8f','#f8ebe9','#f3dcd8','#fdf7f6','#e9c3bd','#963636','#c25e55','#e8ada3','#2b3a46']}[part]||[];
['--dai','--sky','--paper','--soft','--bg','--line','--c1','--c2','--c3','--seal'].forEach((k,i)=>THEME[i]&&document.documentElement.style.setProperty(k,THEME[i]));const E=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const BOOKS='出处缩写：初＝杨公风水初级｜中＝中级｜家＝家居风水高级｜高＝高级｜一课＝风水第一课';
const cover=(n,t,sub,lines)=>`<div class="cover"><div class="seal">观山</div><h1>${t}</h1><h2>${sub}</h2>${lines.map(l=>`<p>${l}</p>`).join('')}<div class="no">之 ${n}</div></div>`;
const S=KD_S24;const xi=z=>S[(S.indexOf(z)+12)%24];
const B='<span class="blank"></span>';
let h='';

/* ---------- 1 自查题册 ---------- */
if(part==='1'){
  h+=cover('一','勘地本','知识自查题册',[`问答 ${KD_CHECK.length} 题＋口诀默写＋查表题`,'先答完一类，再翻到后面答案页对照，对的勾「对」、错的勾「错」','错题就是下一轮要回精讲重读的地方',BOOKS]);
  h+='<h2 class="t">一、问答自查</h2><p class="note">先自己说出或写下要点，再翻答案页对照。答案只取教材原话。</p>';let n=0;
  KD_CATS.forEach(([c,name])=>{h+=`<h3 class="c"><span>${c}</span>${name}</h3>`;KD_CHECK.filter(x=>x[0]===c).forEach(x=>{n++;h+=`<div class="q"><span class="n">${n}</span><div>${E(x[1])}</div><div class="box">☐对 ☐错</div></div>`})});
  // 默写
  h+=`<div class="pb"><h2 class="t">二、口诀默写</h2><p class="note">在横线上填字。答案见答案页第二部分。</p>
  <div class="poem"><b>① 五星〔一课 第18课｜初 p27〕</b>地理先须辨五星，木${B}火${B}土星${B}，金${B}水${B}多成像，千变万化此中生。</div>
  <div class="poem"><b>② 八煞〔中 p195〕</b>坎${B}坤${B}震山${B}，巽${B}乾${B}兑${B}头，艮${B}离${B}为曜煞，宅墓逢之一齐休。</div>
  <div class="poem"><b>③ 贵人峰〔中 p257〕</b>甲戊庚${B}${B}，乙己${B}${B}乡，丙丁${B}${B}位，壬癸${B}${B}藏，六辛逢${B}${B}，此是贵人方。</div>
  <div class="poem"><b>④ 反复黄泉〔中 p186〕</b>庚丁${B}上是黄泉，${B}上庚丁切莫言。乙丙须防${B}水先，${B}向忌行乙丙上，甲癸向上休见${B}，${B}逢甲癸祸连连，辛壬水路怕当${B}，${B}向辛壬祸亦然。</div>
  <div class="poem"><b>⑤ 五不葬〔初 p373〕</b>${B}${B}${B}${B}${B}</div>
  <div class="poem"><b>⑥ 证穴五法〔初 p145〕</b>${B}${B}证穴、${B}${B}证穴、${B}${B}证穴、${B}${B}证穴、${B}${B}证穴</div>
  <div class="poem"><b>⑦ 双龙双水断：写出断语〔中 p174,175〕</b>壬子${B}${B}　癸丑${B}${B}　艮寅${B}${B}${B}${B}　乙辰${B}${B}　辰巽${B}${B}　巳丙${B}${B}　坤申${B}${B}${B}${B}　申庚${B}${B}　戌乾${B}${B}${B}</div></div>`;
  // 查表
  h+=`<div class="pb"><h2 class="t">三、查表题</h2><p class="note">不看书填出来。这几张表就是现场下罗盘后最常查的。</p>
  <h3 class="c"><span>1</span>一卦三山　〔中 p199 以一卦三山分组〕</h3><table><tr>${['坎','艮','震','巽','离','坤','兑','乾'].map(g=>`<th>${g}</th>`).join('')}</tr><tr>${'<td style="height:24px"></td>'.repeat(8)}</tr></table>
  <h3 class="c"><span>2</span>二十四山劫煞（以坐山论）　〔中 p198〕</h3><table><tr><th>坐山</th>${S.slice(0,12).map(z=>`<th>${z}</th>`).join('')}</tr><tr><td>劫在</td>${'<td style="height:24px"></td>'.repeat(12)}</tr><tr><th>坐山</th>${S.slice(12).map(z=>`<th>${z}</th>`).join('')}</tr><tr><td>劫在</td>${'<td style="height:24px"></td>'.repeat(12)}</tr></table>
  <h3 class="c"><span>3</span>隔壁口：写出向上前后一字　〔中 p200〕</h3><table><tr>${['子','卯','午','酉','甲','丙','乾','艮'].map(x=>`<th>${x}向</th>`).join('')}</tr><tr>${'<td style="height:24px"></td>'.repeat(8)}</tr></table>
  <h3 class="c"><span>4</span>九星对五行与吉凶　〔初 p48,401〕</h3><table><tr><th></th>${KD_QUICK.star9.map(x=>`<th>${x[0]}</th>`).join('')}</tr><tr><td>五行</td>${'<td style="height:22px"></td>'.repeat(9)}</tr><tr><td>吉凶</td>${'<td style="height:22px"></td>'.repeat(9)}</tr></table>
  <h3 class="c"><span>5</span>穴上九星对杨公九星　〔中 p9,19〕</h3><table><tr><th></th>${KD_QUICK.xue9.map(x=>`<th>${x[0]}</th>`).join('')}</tr><tr><td>杨公九星</td>${'<td style="height:22px"></td>'.repeat(9)}</tr></table>
  <h3 class="c"><span>6</span>判一判：下列情况犯什么？</h3><table><tr><th style="width:40%">情况</th><th>答案</th></tr>${[['子山午向，辰方来水'],['乾山巽向，卯方有垃圾桶'],['未山丑向，去癸水'],['酉山卯向，入首龙坤'],['坤山艮向，来寅水'],['申龙入首，辛山乙向，走寅水'],['甲山庚向，见辛峰'],['甲山庚向，见丑峰']].map(r=>`<tr><td class="l">${r[0]}</td><td style="height:24px"></td></tr>`).join('')}</table></div>`;
  // 答案
  h+='<div class="pb"><h2 class="t">答案 · 一、问答</h2>';n=0;
  KD_CATS.forEach(([c,name])=>{h+=`<h3 class="c"><span>${c}</span>${name}</h3>`;KD_CHECK.filter(x=>x[0]===c).forEach(x=>{n++;h+=`<div class="ans"><span class="n">${n}</span><div>${E(x[2])}<span class="src">〔${E(x[3])}〕</span></div></div>`})});
  h+='</div>';
  const t6=[['子山午向，辰方来水','坐山八煞（坎龙），水克山祸速〔中 p195,196〕'],['乾山巽向，卯方有垃圾桶','劫煞（乾山劫在卯）〔中 p198,200〕'],['未山丑向，去癸水','隔壁口（丑向前后癸、艮）〔中 p200〕'],['酉山卯向，入首龙坤','龙上八煞（坤兔，向来克龙）〔中 p195〕'],['坤山艮向，来寅水','向上八煞，煞带廉贞血满怀〔中 p196〕'],['申龙入首，辛山乙向，走寅水','串珠理（龙冲口），合交媾〔中 p210〕'],['甲山庚向，见辛峰','河图金局（庚向见辛），辛为4生数主丁〔中 p223–225〕'],['甲山庚向，见丑峰','贵人峰（甲戊庚牛羊）〔中 p257〕']];
  h+=`<div class="pb"><h2 class="t">答案 · 二、默写　三、查表</h2>
  <table><tr><th style="width:24%">题</th><th>答案</th></tr>
  <tr><td>① 五星</td><td class="l">木<b>直</b>火<b>尖</b>土星<b>横</b>，金<b>圆</b>水<b>曲</b>（初级首句作"辨五行"）</td></tr>
  <tr><td>② 八煞</td><td class="l">坎<b>龙</b>坤<b>兔</b>震山<b>猴</b>，巽<b>鸡</b>乾<b>马</b>兑<b>蛇</b>头，艮<b>虎</b>离<b>猪</b>为曜煞</td></tr>
  <tr><td>③ 贵人峰</td><td class="l">甲戊庚<b>牛羊</b>，乙己<b>鼠猴</b>乡，丙丁<b>猪鸡</b>位，壬癸<b>兔蛇</b>藏，六辛逢<b>马虎</b>（民间另一版"庚辛逢马虎"）</td></tr>
  <tr><td>④ 反复黄泉</td><td class="l">庚丁<b>坤</b>上…<b>坤</b>上庚丁…乙丙须防<b>巽</b>水先，<b>巽</b>向忌行乙丙上，甲癸向上休见<b>艮</b>，<b>艮</b>逢甲癸…辛壬水路怕当<b>乾</b>，<b>乾</b>向辛壬…</td></tr>
  <tr><td>⑤ 五不葬</td><td class="l">童、石、独、过、断</td></tr>
  <tr><td>⑥ 证穴五法</td><td class="l">朝山、明堂、水势、乐山、鬼山（后两种专用于横龙结穴）</td></tr>
  <tr><td>⑦ 双龙双水</td><td class="l">壬子水厄｜癸丑双生｜艮寅虎咬并瞎眼｜乙辰自缢｜辰巽聋哑｜巳丙火灾｜坤申双朝寡母缢｜申庚盗贼｜戌乾鼓盆凶</td></tr>
  <tr><td>1 一卦三山</td><td class="l">${['坎','艮','震','巽','离','坤','兑','乾'].map(g=>g+'＝'+S.filter(z=>KD_GUA[z]===g).sort((a,b)=>((S.indexOf(a)+1)%24)-((S.indexOf(b)+1)%24)).join('')).join('　')}</td></tr>
  <tr><td>2 劫煞</td><td class="l">${S.map(z=>z+'→'+KD_JIE[z]).join('　')}</td></tr>
  <tr><td>3 隔壁口</td><td class="l">${['子','卯','午','酉','甲','丙','乾','艮'].map(x=>{const i=S.indexOf(x);return x+'向：'+S[(i+23)%24]+'、'+S[(i+1)%24]}).join('　')}</td></tr>
