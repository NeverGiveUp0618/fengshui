<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111517">
<title>风水知识点清单 · 观山</title>
<style>
:root{
  --paper:#111517; --card:#191e20; --ink:#f1eee6; --ink2:#c4c0b5; --mute:#969d9b;
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.055);
  --indigo:#b89a67; --indigo-soft:rgba(184,154,103,.10);
  --cinnabar:#a87972; --cinnabar-soft:rgba(168,121,114,.14);
  --bar:#b89a67; --shadow:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141816; --card:#1b201e; --ink:#e6e9e6; --ink2:#b3bcb8; --mute:#7f8a86;
    --line:#2b3230; --line2:#232927;
    --indigo:#7bb2c1; --indigo-soft:rgba(123,178,193,.14);
    --cinnabar:#d0837a; --cinnabar-soft:rgba(208,131,122,.14);
    --bar:#6fa8b8; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:15px/1.6 "PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:34px 20px 80px}

/* 头部 */
header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}
.eyebrow{
  margin:0 0 10px;color:var(--indigo);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;font-weight:600;
}
h1{
  margin:0 0 8px;font:600 30px/1.25 "Songti SC","Source Han Serif SC",Georgia,serif;
  letter-spacing:.04em;text-wrap:balance;
}
.sub{margin:0;color:var(--ink2);font-size:13.5px;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.stat{
  border:1px solid var(--line);background:var(--card);border-radius:3px;
  padding:9px 13px;box-shadow:var(--shadow);
}
.stat b{
  display:block;font:600 20px/1 Georgia,"Songti SC",serif;color:var(--indigo);
  font-variant-numeric:tabular-nums;
}
.stat span{display:block;margin-top:5px;font-size:10.5px;color:var(--mute);letter-spacing:.06em}

/* 控制条 */
.bar{
  position:sticky;top:0;z-index:5;background:var(--paper);
  padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px;
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
}
input[type=search]{
  flex:1 1 210px;min-width:0;padding:9px 12px;border:1px solid var(--line);
  border-radius:3px;background:var(--card);color:var(--ink);font:14px/1 inherit;
}
input[type=search]:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:transparent}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{
  border:0;background:var(--card);color:var(--ink2);padding:9px 14px;
  font:12.5px/1 inherit;cursor:pointer;border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--indigo);color:var(--paper);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--cinnabar);outline-offset:-2px}
.count{margin-left:auto;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}

/* 表格 */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{
  position:sticky;top:0;background:var(--card);text-align:left;
  padding:11px 12px;font-size:11px;letter-spacing:.1em;color:var(--mute);
  font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--indigo-soft)}
.term{
  font:500 16px/1.35 "Songti SC","Source Han Serif SC",Georgia,serif;
  letter-spacing:.02em;white-space:nowrap;
}
/* 覆盖本数＝该知识点跨了几本教材，用色带编码 */
.cover{
  display:inline-block;min-width:38px;text-align:center;padding:3px 7px;border-radius:2px;
  font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
  border:1px solid var(--line);color:var(--ink2);background:transparent;
}
.cover.c5{background:var(--cinnabar);color:var(--paper);border-color:transparent}
.cover.c4{background:var(--cinnabar-soft);color:var(--cinnabar);border-color:transparent}
.cover.c3{background:var(--indigo-soft);color:var(--indigo);border-color:transparent}
.cell{min-width:104px}
.cell.none{color:var(--line);font-size:12px}
.hit{display:flex;align-items:center;gap:7px}
.n{
  font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink2);
  min-width:26px;text-align:right;
}
.meter{flex:1;height:4px;background:var(--line2);border-radius:2px;overflow:hidden;min-width:22px}
.meter i{display:block;height:100%;background:var(--bar)}
.pages{
  display:block;margin-top:3px;font-size:10.5px;color:var(--mute);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}

/* 体系视图 */
.cat{margin-bottom:24px;border:1px solid var(--line);border-radius:4px;background:var(--card);overflow:hidden}
.cat>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary::before{content:"›";color:var(--indigo);font-size:15px;transition:transform .18s}
.cat[open]>summary::before{transform:rotate(90deg)}
.cat .code{font:600 12px/1 Georgia,serif;color:var(--paper);background:var(--indigo);padding:4px 7px;border-radius:2px}
.cat h2{margin:0;font:600 17px/1.3 "Songti SC","Source Han Serif SC",Georgia,serif;letter-spacing:.03em}
.cat .n{color:var(--mute);font-size:11.5px;min-width:auto}
.cat .desc{flex:1 1 100%;margin:2px 0 0;color:var(--mute);font-size:11.5px}
.tree{padding:0 16px 16px;margin:0;list-style:none}
.tree ul{list-style:none;margin:3px 0 3px 15px;padding:0 0 0 12px;border-left:1px solid var(--line2)}
.tree li{padding:3px 0}
.node{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.node b{font:500 14.5px/1.4 "Songti SC","Source Han Serif SC",Georgia,serif;font-weight:500}
.tree ul .node b{font-size:13px;color:var(--ink2)}
.star{font-size:10px;font-weight:600;padding:2px 6px;border-radius:2px;white-space:nowrap;
  font-variant-numeric:tabular-nums;background:var(--indigo-soft);color:var(--indigo)}
.star.s5,.star.s4{background:var(--cinnabar);color:var(--paper)}
.star.s3{background:var(--cinnabar-soft);color:var(--cinnabar)}
.tag{font-size:10px;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--mute)}
.where{color:var(--mute);font-size:10.5px;font-variant-numeric:tabular-nums}

/* 分组视图 */
.book{margin-bottom:26px}
.book h2{
  margin:0 0 4px;font:600 19px/1.3 "Songti SC","Source Han Serif SC",Georgia,serif;
  letter-spacing:.04em;
}
.book .note{margin:0 0 12px;color:var(--mute);font-size:12px}
.sec{border-top:1px solid var(--line);padding:13px 0}
.sec h3{
  margin:0 0 9px;font-size:12.5px;font-weight:600;color:var(--indigo);
  letter-spacing:.03em;
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:3px;
  padding:5px 9px;font-size:13px;color:var(--ink);
  font-family:"Songti SC","Source Han Serif SC",Georgia,serif;
}
.chip em{
  font-style:normal;color:var(--mute);font-size:10px;margin-left:5px;
  font-family:"PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums;
}
.chip mark,.term mark{background:var(--cinnabar-soft);color:var(--cinnabar);padding:0 1px}
.empty{padding:40px 12px;text-align:center;color:var(--mute);font-size:13.5px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:11.5px}
@media (max-width:640px){
  .wrap{padding:22px 13px 60px} h1{font-size:24px}
  .count{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.back{display:inline-block;margin-bottom:14px;color:var(--indigo);text-decoration:none;font-size:12px;letter-spacing:.06em}
.back:hover{color:#dbc79f}
.stat b{font-family:Georgia,"Songti SC",serif}
</style>
</head>
<body>


<div class="wrap">
<a class="back" href="./">‹ 返回观山</a>
<header>
  <p class="eyebrow">杨公风水 · 三僚一脉</p>
  <h1>风水知识点清单</h1>
  <p class="sub">从五本教材归集、按教材自身体系（龙穴砂水向 → 理气 → 罗盘 → 应用）分类。知识点名取自教材原有条目标题，未改写。★ 标记该知识点被几本教材讲过——数字越大，写精讲时越需要把几处并到一起。</p>
  <div class="stats">
    <div class="stat"><b>1,110</b><span>已归类知识点</span></div>
    <div class="stat"><b>13</b><span>体系分类</span></div>
    <div class="stat"><b>335</b><span>跨教材知识点</span></div>
    <div class="stat"><b>558,852</b><span>教材净字数</span></div>
  </div>
</header>

<div class="bar">
  <input type="search" id="q" placeholder="搜索知识点：黄泉 / 过峡 / 二十四山 / 明堂" autocomplete="off">
  <div class="seg" role="group" aria-label="视图">
    <button id="v0" aria-pressed="true">体系骨架</button>
    <button id="v1" aria-pressed="false">跨教材分布</button>
    <button id="v2" aria-pressed="false">按教材分组</button>
  </div>
  <div class="seg" id="filters" role="group" aria-label="覆盖本数筛选">
    <button data-cov="0" aria-pressed="true">全部</button>
    <button data-cov="5" aria-pressed="false">5本</button>
    <button data-cov="4" aria-pressed="false">≥4本</button>
    <button data-cov="3" aria-pressed="false">≥3本</button>
  </div>
  <span class="count" id="count"></span>
</div>

<div id="view"></div>

<footer>
  归集自《杨公风水初级／中级／高级合集》《家居风水高级课程合集》《风水第一课》。
  同一个知识点在不同教材里深浅与侧重不同——覆盖本数越多，整合时越需要把几处并到一起看。
</footer>
</div>

<script src="data/index.js"></script>
<script>
const D = FSINDEX;
const LABELS = D.labels;
const view = document.getElementById('view');
const qbox = document.getElementById('q');
const countEl = document.getElementById('count');
let mode = 'cat', cov = 0, q = '';

// 频次条的上限按每本各自的最大值归一，否则初级（页数最多）会把其余四本压成一条线
const MAXBY = {};
LABELS.forEach(l => {
  MAXBY[l] = Math.max(1, ...Object.values(D.multi).map(b => (b[l] ? b[l][0] : 0)));
});

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = s => q ? esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'), m => '<mark>'+m+'</mark>') : esc(s);

const rows = () => Object.entries(D.multi)
  .filter(([t, b]) => (!q || t.includes(q)) && Object.keys(b).length >= cov)
  .sort((a, b) => {
    const ca = Object.keys(a[1]).length, cb = Object.keys(b[1]).length;
    if (ca !== cb) return cb - ca;
    const sa = Object.values(a[1]).reduce((n, v) => n + v[0], 0);
    const sb = Object.values(b[1]).reduce((n, v) => n + v[0], 0);
    return sb - sa;
  });

function renderCross() {
  const rs = rows();
  countEl.textContent = rs.length + ' 个知识点';
  if (!rs.length) { view.innerHTML = '<p class="empty">没有匹配的知识点。</p>'; return; }
  let h = '<div class="tablewrap"><table><thead><tr><th>知识点</th><th>覆盖</th>'
        + LABELS.map(l => '<th>' + l + '</th>').join('') + '</tr></thead><tbody>';
  for (const [t, b] of rs) {
    const c = Object.keys(b).length;
    h += '<tr><td class="term">' + hl(t) + '</td>'
       + '<td><span class="cover c' + c + '">' + c + ' 本</span></td>';
    for (const l of LABELS) {
      const v = b[l];
      if (!v) { h += '<td class="cell none">—</td>'; continue; }
      const [n, pages] = v;
      const w = Math.max(6, Math.round(n / MAXBY[l] * 100));
      h += '<td class="cell"><div class="hit"><span class="n">' + n + '</span>'
         + '<span class="meter"><i style="width:' + w + '%"></i></span></div>'
         + '<span class="pages">' + pages.slice(0, 4).join(' ')
         + (pages.length > 4 ? ' +' + (pages.length - 4) : '') + '</span></td>';
    }
    h += '</tr>';
  }
  view.innerHTML = h + '</tbody></table></div>';
}

function renderCats() {
  let shown = 0;
  const node = (x, depth) => {
    if (q && !x.t.includes(q) && !hasHit(x)) return '';
    shown++;
    const st = x.nb >= 2
      ? `<span class="star s${x.nb}">★ ${x.nb} 本</span>` : '';
    const where = x.nb >= 2
      ? Object.entries(x.sp).map(([b, n]) => b + n).join(' · ')
      : Object.entries(x.src).map(([b, ps]) => b + (ps.length ? ' p' + ps.join(',') : '')).join('；');
    const tags = (x.ctx || []).map(c => `<span class="tag">${c}</span>`).join('');
    const kids = (x.kids || []).map(k => node(k, depth + 1)).filter(Boolean).join('');
    return `<li><div class="node"><b>${hl(x.t)}</b>${st}${tags}`
         + `<span class="where">${esc(where)}</span></div>`
         + (kids ? `<ul>${kids}</ul>` : '') + '</li>';
  };
  const hasHit = x => !q ? true
    : x.t.includes(q) || (x.kids || []).some(hasHit);
  let h = '';
  for (const cat of D.cats) {
    const body = cat.items.map(x => node(x, 0)).filter(Boolean).join('');
    if (!body) continue;
    // 搜索时自动展开，方便直接看到命中；平时只展开第一类，免得开局就是一屏长列表
    const open = q || cat.c === 'A' ? ' open' : '';
    h += `<details class="cat"${open}><summary><span class="code">${cat.c}</span>`
       + `<h2>${esc(cat.name)}</h2><span class="n">${cat.n} 个</span>`
       + `<p class="desc">${esc(cat.desc)}</p></summary><ul class="tree">${body}</ul></details>`;
  }
  countEl.textContent = shown + ' 个知识点';
  view.innerHTML = h || '<p class="empty">没有匹配的知识点。</p>';
}

function renderBooks() {
  let total = 0, h = '';
  for (const label of LABELS) {
    const items = (D.struct[label] || []).filter(x => !q || x.t.includes(q));
    total += items.length;
    if (!items.length) continue;
    const secs = [];
    for (const it of items) {
      if (!secs.length || secs[secs.length - 1].s !== it.s) secs.push({ s: it.s, list: [] });
      secs[secs.length - 1].list.push(it);
    }
    h += '<section class="book"><h2>' + esc(label) + '</h2>'
       + '<p class="note">' + items.length + ' 条 · ' + secs.length + ' 个章节</p>';
    for (const sec of secs) {
      h += '<div class="sec"><h3>' + esc(sec.s || '（未分节）') + '</h3><div class="chips">'
         + sec.list.map(x => '<span class="chip">' + hl(x.t)
             + (x.p ? '<em>p' + x.p + '</em>' : '') + '</span>').join('')
         + '</div></div>';
    }
    h += '</section>';
  }
  countEl.textContent = total + ' 条目';
  view.innerHTML = h || '<p class="empty">没有匹配的条目。</p>';
}

const render = () => mode === 'cat' ? renderCats() : mode === 'cross' ? renderCross() : renderBooks();

qbox.addEventListener('input', e => { q = e.target.value.trim(); render(); });
document.getElementById('v0').addEventListener('click', () => setMode('cat'));
document.getElementById('v1').addEventListener('click', () => setMode('cross'));
document.getElementById('v2').addEventListener('click', () => setMode('book'));
function setMode(m) {
  mode = m;
  document.getElementById('v0').setAttribute('aria-pressed', m === 'cat');
  document.getElementById('v1').setAttribute('aria-pressed', m === 'cross');
  document.getElementById('v2').setAttribute('aria-pressed', m === 'book');
  // 覆盖本数筛选只对跨教材表有意义
  document.getElementById('filters').style.display = m === 'cross' ? '' : 'none';
  render();
}
document.getElementById('filters').style.display = 'none';
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-cov]'); if (!b) return;
  cov = +b.dataset.cov;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
render();
</script>

</body>
</html>
